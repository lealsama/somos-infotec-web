<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Somos Infotec · Directiva estudiantil de Infotecnología UJCV</title>
  <meta name="description" content="Somos Infotec: planilla de directiva estudiantil de Infotecnología, UJCV Campus Comayagua. Conocé al equipo y nuestras propuestas.">
  <meta name="theme-color" content="#0a2530">
  <link rel="icon" href="img/icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilos.css?v=proposito-6">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="barra">
    <div class="contenedor barra__fila">
      <a class="marca" href="#inicio" aria-label="Somos Infotec, ir al inicio">
        <span class="marca__icono" aria-hidden="true">&lt;/&gt;</span>
        <span><span class="marca__cian">Somos</span> Infotec</span>
      </a>
      <button class="menu-boton" type="button" aria-expanded="false" aria-controls="menu">
        <span class="sr">Abrir menú</span>
        <span class="menu-boton__barras" aria-hidden="true"></span>
      </button>
      <nav id="menu" class="menu" aria-label="Secciones">
        <a href="#inicio" class="activo" aria-current="true">Inicio</a>
        <a href="#proposito">Propósito</a>
        <a href="#equipo">Equipo</a>
        <a href="#propuestas">Propuestas</a>
        <a href="#muestra">Muestra</a>
      </nav>
    </div>
  </header>

  <main id="contenido">
    <!-- PORTADA -->
    <section id="inicio" data-menu="inicio" class="portada" aria-labelledby="portada-titulo">
      <img class="portada__img" id="portada-img" src="img/campus.jpg" alt="" width="1800" height="972" fetchpriority="high">
      <div class="contenedor portada__texto">
        <p class="etiqueta" id="portada-etiqueta"></p>
        <h1 id="portada-titulo"></h1>
        <p class="portada__parrafo" id="portada-texto"></p>
        <div class="botones">
          <a class="boton boton--lima" href="#propuestas">Conocé nuestras propuestas</a>
          <a class="boton boton--borde" href="#equipo">Ver el equipo</a>
        </div>
      </div>
    </section>

    <div id="proposito" data-menu="proposito" class="identidad">
      <!-- LEMA -->
      <section class="lema" aria-label="Lema">
        <p class="contenedor lema__texto"><span id="lema-1"></span> <span class="cian" id="lema-2"></span></p>
      </section>

      <!-- MISIÓN Y VISIÓN -->
      <section class="mv" aria-label="Misión y visión">
        <div class="contenedor mv__grid">
          <div>
            <h2 class="titulo">Misión</h2>
            <p class="mv__texto" id="mision"></p>
          </div>
          <div class="mv__col2">
            <h2 class="titulo">Visión</h2>
            <p class="mv__texto" id="vision"></p>
          </div>
        </div>
      </section>
    </div>

      <!-- OBJETIVO GENERAL -->
      <section class="objetivo" data-menu="proposito" aria-labelledby="og-titulo">
        <div class="contenedor">
          <h2 class="titulo" id="og-titulo">Objetivo general</h2>
          <p class="objetivo__texto" id="objetivo-general"></p>
        </div>
      </section>

      <!-- OBJETIVOS ESPECÍFICOS -->
      <section class="especificos" data-menu="proposito" aria-labelledby="oe-titulo">
        <div class="contenedor">
          <h2 class="titulo" id="oe-titulo">Objetivos específicos</h2>
          <dl class="lista-objetivos" id="objetivos"></dl>
        </div>
      </section>
    <!-- INTEGRANTES -->
    <section id="equipo" data-menu="equipo" class="equipo" aria-labelledby="equipo-titulo">
      <div class="contenedor">
        <h2 class="titulo" id="equipo-titulo">Integrantes</h2>
        <img class="foto-grupal" id="foto-grupal" src="img/foto-grupal.jpg" alt="" width="1800" height="886" loading="lazy">

      </div>
    </section>
    <section class="equipo fichas-equipo" data-menu="equipo" aria-label="Fichas de integrantes">
      <div class="contenedor">
        <h2 class="titulo">Integrantes</h2>
        <div class="recorrido-equipo">
          <div class="carrusel" role="region" aria-roledescription="carrusel" aria-label="Carrusel de integrantes">
            <ul class="carrusel__pista" id="pista" tabindex="0"
                aria-label="Lista de integrantes. Usá las flechas izquierda y derecha para moverte."></ul>
            <div class="carrusel__controles">
              <p class="carrusel__contador" aria-live="polite"><strong id="contador">1–5</strong> de <span id="total">10</span> integrantes</p>
              <div class="carrusel__flechas">
                <button type="button" class="flecha" id="anterior" aria-label="Integrantes anteriores">&#8592;</button>
                <button type="button" class="flecha" id="siguiente" aria-label="Integrantes siguientes">&#8594;</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- PROPUESTAS -->
    <section id="propuestas" data-menu="propuestas" class="propuestas" aria-labelledby="prop-titulo">
      <div class="contenedor">
        <h2 class="titulo" id="prop-titulo">Nuestras propuestas</h2>
        <p class="propuestas__intro" id="propuestas-intro"></p>
        <div class="pestanas" role="tablist" aria-label="Propuestas" id="pestanas"></div>
        <div class="detalle" role="tabpanel" id="detalle" tabindex="0">
          <div>
            <h3 id="detalle-nombre"></h3>
            <p id="detalle-texto"></p>
          </div>
          <div class="detalle__paso">
            <p class="detalle__paso-titulo">Primer paso</p>
            <p id="detalle-paso"></p>
          </div>
        </div>

      </div>
    </section>
    <section id="muestra" data-menu="muestra" class="cierre" aria-labelledby="muestra-titulo">
      <div class="contenedor">
        <article class="muestra" aria-labelledby="muestra-titulo">
          <div>
            <h3 id="muestra-titulo"></h3>
            <p id="muestra-texto"></p>
          </div>
          <span class="chip" id="muestra-etiqueta"></span>
        </article>
      </div>
    <!-- COMPARTIR -->
    <div class="compartir">
      <div class="contenedor compartir__fila">
        <div>
          <h2 class="compartir__titulo" id="comp-titulo"></h2>
          <p id="comp-texto"></p>
        </div>
        <div class="compartir__acciones">
          <button type="button" class="boton boton--lima" id="copiar">Copiar enlace</button>
          <button type="button" class="boton boton--borde" id="compartir" hidden>Compartir</button>
          <p class="compartir__estado" id="estado" role="status"></p>
        </div>
      </div>
    </div>
    </section>
  </main>

  <footer class="pie"><p class="contenedor" id="pie"></p></footer>

  <noscript><p class="sin-js">Para ver el contenido completo, activá JavaScript en tu navegador.</p></noscript>

  <script src="js/contenido.js?v=diapositivas-2"></script>
  <script src="js/app.js?v=proposito-5"></script>
</body>
</html>
